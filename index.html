<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>DUNGEON FLICKER</title>
        <link rel="stylesheet" href="/styles/main.css" />
        <!-- Pirata One: only for the Pursuer's countdown. Cinzel: room titles and character select. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Pirata+One&display=swap" />
        <link rel="preload" href="/images/barbarian-nobg.webp" as="image" />
        <link rel="preload" href="/images/wizard-nobg.webp" as="image" />
        <link rel="preload" href="/images/necromancer-nobg.webp" as="image" />
        <link rel="preload" href="/images/rogue-nobg.webp" as="image" />
    </head>
    <body>
        <script type="module" src="/main.js"></script>

        <div id="black-overlay"></div>
        <div id="disc-info-popup" class="popup element-hidden">
            <h4>
                <span class="name">Disc Name</span>
                <span class="hp">HP: X/Y</span>
            </h4>
            <div class="description">Empty for now</div>
        </div>
        <div id="throw-info"></div>
        <div id="disc-names">
            <ul id="disc-names-list"></ul>
        </div>

        <div id="powers-area">
            <button id="rage-button" style="display: none">Rage!</button>
        </div>
        <div id="fps-counter">FPS: --</div>
    </body>
</html>
